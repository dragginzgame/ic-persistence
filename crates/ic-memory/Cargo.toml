[package]
name = "ic-memory"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
readme.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
clap.workspace = true
ic-build.workspace = true
ic-host-artifacts.workspace = true
ic-host-fs.workspace = true
ic-host-process.workspace = true
ic-testkit-native = { workspace = true, features = ["stable-memory"] }

[features]
test-support = []

[dependencies]
ic-platform = { workspace = true, features = ["stable-structures"] }
serde.workspace = true
serde_cbor.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
toml.workspace = true
trybuild.workspace = true

[[example]]
name = "composed_host"
path = "examples/composed_host.rs"
test = true

[[example]]
name = "repo-tool"
path = "examples/repo-tool.rs"
test = true

[[example]]
name = "wasm-core-size-probe"
path = "examples/wasm_core_size_probe.rs"
crate-type = ["cdylib"]

[[example]]
name = "wasm-diagnostics-size-probe"
path = "examples/wasm_diagnostics_size_probe.rs"
crate-type = ["cdylib"]

[[example]]
name = "wasm-admission-size-probe"
path = "examples/wasm_admission_size_probe.rs"
crate-type = ["cdylib"]

[[example]]
name = "wasm-runtime-integration-size-probe"
path = "examples/wasm_runtime_integration_size_probe.rs"
