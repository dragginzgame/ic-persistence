[package]
name = "ic-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Governed stable collections for Internet Computer applications"
license.workspace = true
readme = "README.md"
publish = ["crates-io"]

[dependencies]
ic-memory.workspace = true
ic-platform = { workspace = true, features = ["stable-structures"] }

[dev-dependencies]
ic-memory = { workspace = true, features = ["test-support"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
