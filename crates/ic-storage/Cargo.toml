[package]
name = "ic-storage"
version = "0.59.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Governed stable collections for Internet Computer applications"
license.workspace = true
readme = "README.md"
publish = ["crates-io"]

[dependencies]
ic-memory.workspace = true
ic-platform = { workspace = true, features = ["stable-structures"] }
thiserror.workspace = true

[dev-dependencies]
ic-memory = { workspace = true, features = ["test-support"] }
ic-wire.workspace = true
serde.workspace = true

[[example]]
name = "wasm-storage-qualification"
path = "examples/wasm_storage_qualification.rs"
crate-type = ["cdylib"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
