# Keep PocketIC's host-only dependency graph out of the library's normal gates.
[workspace]
resolver = "3"
members = ["crates/ic-memory-runtime-qualification"]
default-members = ["crates/ic-memory-runtime-qualification"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
# Native client boundary; Testkit retains server selection and lifecycle.
ic-platform = { version = "0.7.3", default-features = false, features = ["pocket-ic"] }
ic-wire = "0.7.21"
serde = { version = "1.0", features = ["derive"] }
