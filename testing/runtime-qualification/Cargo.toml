# Keep PocketIC's host-only dependency graph out of the library's normal gates.
[workspace]
resolver = "3"
members = [
    "crates/ic-storage-benchmarks",
    "crates/ic-storage-platform-qualification",
    "crates/ic-storage-runtime-qualification",
]
default-members = ["crates/ic-storage-runtime-qualification"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
# Facade for the native client and explicit runtime-composition fixture.
# Testkit retains server selection and lifecycle.
ic-platform = { version = "0.18.0", default-features = false }
ic-platform-runtime = { version = "0.18.0", default-features = false }
# Platform 0.18 removed the upstream collection facade. Keep it solely for
# the unpublished DFINITY comparison; production and native clients use 0.18.
ic-platform-stable-benchmark = { package = "ic-platform", version = "0.17.0", default-features = false }
ic-storage = { path = "../../crates/ic-storage", version = "0.65.0" }
ic-wire = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.comparison]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
