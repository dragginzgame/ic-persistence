[workspace]
resolver = "3"
members = [
    "crates/ic-logging-stable",
    "crates/ic-memory",
    "crates/ic-metrics-stable",
    "crates/ic-storage",
]
default-members = [
    "crates/ic-logging-stable",
    "crates/ic-memory",
    "crates/ic-metrics-stable",
    "crates/ic-storage",
]
# Independent unpublished runtime qualification workspace.
exclude = ["testing/runtime-qualification"]

[workspace.package]
edition = "2024"
rust-version = "1.91.0"
license = "MIT"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "Durable stable-memory allocation governance for Internet Computer canisters"
readme = "crates/ic-memory/README.md"
documentation = "https://docs.rs/ic-memory"
homepage = "https://github.com/dragginzgame/ic-persistence"
repository = "https://github.com/dragginzgame/ic-persistence"
keywords = ["ic-stable-structures", "memory-id", "registry", "canister", "icp"]
categories = ["wasm", "data-structures"]

[workspace.dependencies]
# persistence
# Changelog : releases/persistence/CHANGELOG.md
ic-memory = { path = "crates/ic-memory", version = "0.60.2" }
ic-storage = { path = "crates/ic-storage", version = "0.60.2" }

# metrics-stable
# Changelog : releases/metrics-stable/CHANGELOG.md
ic-metrics-stable = { path = "crates/ic-metrics-stable", version = "0.61.1" }

# logging-stable
# Changelog : releases/logging-stable/CHANGELOG.md
ic-logging-stable = { path = "crates/ic-logging-stable", version = "0.60.0" }

# External production dependencies.
ic-logging = { version = "0.23.3", default-features = false }
# Default native metadata shares the selected Wire identity.
ic-metrics = "0.24.1"
thiserror = "2.0"

# External dependencies with mixed production/test usage; members select features.
ic-platform = { version = "0.15.3", default-features = false }
ic-wire = { version = "0.13.0", default-features = false }
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }

# External tests/tooling only; Build/Host/Testkit and Clap are native-only.
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
ic-build = { version = "0.73.2", default-features = false }
ic-host-artifacts = { version = "0.73.2", default-features = false }
ic-host-fs = { version = "0.73.2", default-features = false }
ic-host-process = { version = "0.73.2", default-features = false }
ic-testkit-native = { version = "0.75.0", default-features = false }
serde_json = "1.0"
toml = "1.1.6"
trybuild = "1.0.121"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

missing_const_for_fn = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"

# Shared style choices cover native/Wasm libraries, examples and fixtures.
# Cargo lint tables cannot express configuration-specific expectations; individual
# exceptions use scoped expectations in source.
doc_markdown = "allow"
empty_line_after_doc_comments = "allow"
enum_variant_names = "allow"
missing_errors_doc = "allow"
module_inception = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
struct_field_names = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"

[profile.wasm-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
