[workspace]
members = ["crates/ic-storage"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85.0"
repository = "https://github.com/dragginzgame/ic-storage"
description = "Page-based stable-memory B-tree storage for Internet Computer applications"
license = "MIT"

[workspace.dependencies]
ic-stable-structures = "0.7.2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
