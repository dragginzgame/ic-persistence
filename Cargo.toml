[workspace]
members = ["crates/ic-storage"]
default-members = ["crates/ic-storage"]
resolver = "3"

[workspace.package]
version = "0.5.4"
edition = "2024"
rust-version = "1.91.0"
repository = "https://github.com/dragginzgame/ic-storage"
description = "Governed stable collections for Internet Computer applications"
license = "MIT"

[workspace.dependencies]
# Production dependencies
ic-memory = "0.48"
ic-stable-structures = "0.7.2"

# Tests and tooling only
# Both catalog entries are also used by the production library.

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
