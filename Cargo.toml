[workspace]
members = ["crates/ic-storage"]
default-members = ["crates/ic-storage"]
resolver = "3"

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.91.0"
repository = "https://github.com/dragginzgame/ic-storage"
description = "Governed stable collections for Internet Computer applications"
license = "MIT"

[workspace.dependencies]
# Allocation authority and exclusive runtime handles.
ic-memory = "0.48"
# Private collection substrate; consumers use ic_storage::adapter.
ic-stable-structures = "0.7.2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
