[workspace]
members = ["crates/ic-storage", "crates/ic-storage-bench"]
default-members = ["crates/ic-storage"]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.85.0"
repository = "https://github.com/dragginzgame/ic-storage"
description = "Page-based stable-memory B-tree storage for Internet Computer applications"
license = "MIT"

[workspace.dependencies]
candid = "0.10.38"
ic-cdk = "0.20.3"
ic-host-fs = "0.22"
ic-stable-structures = "0.7.2"
ic-storage = { path = "crates/ic-storage" }
ic-testkit = "0.49"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
