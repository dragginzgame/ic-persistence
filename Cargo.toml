[workspace]
resolver = "3"
members = ["crates/ic-memory", "crates/ic-storage"]
default-members = ["crates/ic-memory", "crates/ic-storage"]
exclude = ["testing/runtime-qualification"]

[workspace.package]
edition = "2024"
rust-version = "1.91.0"
version = "0.50.1"
license = "MIT"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "Durable stable-memory allocation governance for Internet Computer canisters"
readme = "crates/ic-memory/README.md"
documentation = "https://docs.rs/ic-memory"
homepage = "https://github.com/dragginzgame/ic-persistence"
repository = "https://github.com/dragginzgame/ic-persistence"
keywords = ["ic-stable-structures", "memory-id", "registry", "canister", "icp"]
categories = ["wasm", "data-structures"]

[workspace.dependencies]
# Production dependencies
ic-memory = { path = "crates/ic-memory", version = "0.50.1" }
# Qualified manager/Cell layout boundary; see AGENTS.md#dependency-exceptions.
ic-stable-structures = "=0.7.2"
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }
serde_cbor = "0.11.2"
thiserror = "2.0"

# Tests and tooling only
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
ic-build = { version = "0.62.1", default-features = false }
ic-host-artifacts = { version = "0.62.1", default-features = false }
ic-host-fs = { version = "0.62.1", default-features = false }
ic-host-process = { version = "0.62.1", default-features = false }
serde_json = "1.0"
toml = "1.1.6"
trybuild = "1.0.121"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

missing_const_for_fn = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"

doc_markdown = "allow"
empty_line_after_doc_comments = "allow"
enum_variant_names = "allow"
missing_errors_doc = "allow"
module_inception = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
struct_field_names = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"

[profile.wasm-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
